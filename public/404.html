<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#fbf8f2" />
    <title>Página no encontrada — Stellaris</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 78% 35%, #f2e2d2 0%, #f8f1e7 42%, #f5eee4 100%); color: #2d403c; font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif; }
      main { max-width: 460px; text-align: center; }
      .star { color: #b58a50; font-size: 3rem; line-height: 1; }
      h1 { margin: 18px 0 10px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.2rem, 8vw, 3.4rem); font-weight: 500; line-height: 1; }
      p { margin: 0; color: #817363; line-height: 1.7; font-size: 0.95rem; }
      a { display: inline-flex; margin-top: 26px; border-radius: 999px; padding: 12px 20px; background: #a9794f; color: #fffaf3; font-size: 0.8rem; letter-spacing: 0.04em; text-decoration: none; }
      a:hover { background: #8e6242; }
    </style>
  </head>
  <body>
    <main>
      <div class="star">✳</div>
      <h1>Esta página se perdió entre las estrellas.</h1>
      <p>No hemos encontrado lo que buscabas. Vuelve al inicio y sigue explorando el universo Stellaris.</p>
      <a href="/">Volver al inicio</a>
    </main>
  </body>
</html>
